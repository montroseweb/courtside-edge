name: kalshi-snapshot
# Publishes Kalshi NBA market prices to the `data` branch ~every minute so the
# githack-hosted page can read them (Kalshi blocks direct browser requests).
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/kalshi-snapshot.yml', 'tools/kalshi-snapshot.js']
permissions:
  contents: write
  actions: write   # lets the job start its own successor (GITHUB_TOKEN may dispatch workflow runs)
concurrency:
  group: kalshi-snapshot
  cancel-in-progress: false  # new runs wait for the running one (no mid-run cancels, no restart loops)
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/kalshi-snapshot.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MINUTES: '340'
          EVERY_SECONDS: '55'
      # hand over to a fresh run so the feed never goes quiet (scheduled runs are only a backup)
      - if: ${{ !cancelled() }}
        run: gh workflow run kalshi-snapshot.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
