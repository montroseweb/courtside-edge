name: kalshi-snapshot
# Publishes Kalshi NBA market prices to the `data` branch ~every minute so the
# githack-hosted page can read them (Kalshi blocks direct browser requests).
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/kalshi-snapshot.yml', 'tools/kalshi-snapshot.js']
permissions:
  contents: write
concurrency:
  group: kalshi-snapshot
  cancel-in-progress: true   # each new run (every 30 min) replaces the previous one
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/kalshi-snapshot.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MINUTES: '45'
          EVERY_SECONDS: '55'
